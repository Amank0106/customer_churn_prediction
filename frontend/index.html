<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <div class="badge">AI CUSTOMER ANALYTICS</div>
            <h1>Customer Churn Predictor</h1>
            <p>Enter customer details to estimate their likelihood of leaving the telecom service.</p>
        </header>

        <form id="churnForm">
            <section class="card">
                <h2>Customer Information</h2>
                <div class="grid">
                    <label>Gender
                        <select name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </label>

                    <label>Senior Citizen
                        <select name="SeniorCitizen" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </label>

                    <label>Partner
                        <select name="Partner" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </label>

                    <label>Dependents
                        <select name="Dependents" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </label>

                    <label>Tenure (months)
                        <input type="number" name="tenure" min="0" max="100" step="1" placeholder="e.g. 12" required>
                    </label>
                </div>
            </section>

            <section class="card">
                <h2>Services</h2>
                <div class="grid">
                    <label>Phone Service
                        <select name="PhoneService" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </label>

                    <label>Multiple Lines
                        <select name="MultipleLines" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No phone service">No phone service</option>
                        </select>
                    </label>

                    <label>Internet Service
                        <select name="InternetService" required>
                            <option value="DSL">DSL</option>
                            <option value="Fiber optic">Fiber optic</option>
                            <option value="No">No</option>
                        </select>
                    </label>

                    <label>Online Security
                        <select name="OnlineSecurity" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </label>

                    <label>Online Backup
                        <select name="OnlineBackup" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </label>

                    <label>Device Protection
                        <select name="DeviceProtection" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </label>

                    <label>Tech Support
                        <select name="TechSupport" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </label>

                    <label>Streaming TV
                        <select name="StreamingTV" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </label>

                    <label>Streaming Movies
                        <select name="StreamingMovies" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                            <option value="No internet service">No internet service</option>
                        </select>
                    </label>
                </div>
            </section>

            <section class="card">
                <h2>Contract & Billing</h2>
                <div class="grid">
                    <label>Contract
                        <select name="Contract" required>
                            <option value="Month-to-month">Month-to-month</option>
                            <option value="One year">One year</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </label>

                    <label>Paperless Billing
                        <select name="PaperlessBilling" required>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </label>

                    <label>Payment Method
                        <select name="PaymentMethod" required>
                            <option value="Electronic check">Electronic check</option>
                            <option value="Mailed check">Mailed check</option>
                            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                            <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                    </label>

                    <label>Monthly Charges
                        <input type="number" name="MonthlyCharges" min="0" step="0.01" placeholder="e.g. 70.50" required>
                    </label>

                    <label>Total Charges
                        <input type="number" name="TotalCharges" min="0" step="0.01" placeholder="e.g. 850.20" required>
                    </label>
                </div>
            </section>

            <button type="submit" id="predictBtn">Predict Churn</button>
        </form>

        <section id="result" class="result hidden">
            <div id="riskBadge" class="risk-badge"></div>
            <h2 id="predictionText"></h2>
            <div class="probability">
                <span id="probabilityValue">0%</span>
                <div class="bar"><div id="barFill"></div></div>
            </div>
            <p id="resultMessage"></p>
        </section>

        <p id="error" class="error hidden"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
